<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151413">
  <title>Поля — художественный архив</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="references.js"></script>
  <script defer src="data/offline.js"></script>
  <script defer src="reference-catalog.js"></script>
  <script defer src="stickers.js"></script>
  <script defer src="sticker-store.js"></script>
  <script defer src="sticker-finish.js"></script>
  <script defer src="reference-palette.js"></script>
  <script defer src="book-motion.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <section id="cover-stage" class="cover-stage" aria-label="Закрытый блокнот" hidden>
    <div class="cover-book"><div class="cover-leaf"><strong>Поля</strong><div class="cover-binding">
      <span class="strap-band" aria-hidden="true"></span><span class="strap-buckle" aria-hidden="true"></span>
      <button id="cover-strap" aria-label="Открыть блокнот" title="Потяните за конец ремешка или нажмите"><span class="strap-tail" aria-hidden="true"><i></i><i></i><i></i></span></button>
    </div></div></div>
  </section>
  <main class="notebook">
    <div class="paper-pages" aria-hidden="true"></div>
    <header class="notebook-header">
      <div class="identity"><strong>Поля</strong><span>Художественный архив</span></div>
      <div class="book-actions"><button id="show-archive" class="archive-button">Архив <span id="count">0</span></button><button id="close-book" title="Закрыть блокнот" aria-label="Закрыть блокнот">▰</button></div>
    </header>
    <div id="tools" class="tools" hidden>
      <div class="tool-row" role="group" aria-label="Инструменты наброска">
        <button id="hand" title="Рука" aria-label="Рука" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M8 13V6a1.5 1.5 0 0 1 3 0v5-7a1.5 1.5 0 0 1 3 0v7-5a1.5 1.5 0 0 1 3 0v6-3a1.5 1.5 0 0 1 3 0v6a6 6 0 0 1-6 6h-1c-2 0-3-1-4-2l-4-5a1.6 1.6 0 0 1 2-2l1 1Z"/></svg></button>
        <button id="pencil" title="Карандаш" aria-label="Карандаш" aria-pressed="false" aria-controls="ink-panel" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="m4 20 4-1 12-12-3-3L5 16l-1 4Zm11-14 3 3"/></svg></button>
        <button id="brush" title="Кисть" aria-label="Кисть" aria-pressed="false" aria-controls="ink-panel" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="m9 14 8-10c2-2 5 1 3 3L10 15M11 16c0 4-5 5-8 4 2-1 1-4 3-5s4-1 5 1Z"/></svg></button>
        <button id="eraser" title="Ластик" aria-label="Ластик" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m4 14 9-9a2 2 0 0 1 3 0l4 4a2 2 0 0 1 0 3l-7 7H9l-5-5Zm5-5 8 8m-4 2h8"/></svg></button>
        <button id="line" title="Прямая линия" aria-label="Прямая линия" aria-pressed="false" aria-controls="ink-panel" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="m5 19 14-14"/></svg></button>
        <button id="stickers" title="Вклейки" aria-label="Вклейки" aria-pressed="false" aria-controls="sticker-panel" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M20 13V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h7l7-7Zm0 0h-5a2 2 0 0 0-2 2v5M8 9h5m-5 4h2"/></svg></button>
        <button id="undo" title="Отменить" aria-label="Отменить"><svg viewBox="0 0 24 24"><path d="m9 5-5 5 5 5m-5-5h10a5 5 0 0 1 5 5v3"/></svg></button>
        <button id="redo" title="Повторить" aria-label="Повторить"><svg viewBox="0 0 24 24"><path d="m15 5 5 5-5 5m5-5H10a5 5 0 0 0-5 5v3"/></svg></button>
        <button id="clear" title="Очистить рисунок" aria-label="Очистить рисунок"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"/></svg></button>
        <button id="export" title="Экспорт PNG" aria-label="Экспорт PNG"><svg viewBox="0 0 24 24"><path d="M12 4v11m-4-4 4 4 4-4M5 15v5h14v-5"/></svg></button>
      </div>
      <div id="mobile-palette" hidden></div>
      <section id="ink-panel" class="tool-popover" aria-label="Настройки линии" hidden>
        <label>Цвет <input id="ink" type="color" value="#f1ab94"></label>
        <label>Толщина <input id="width" type="range" min="1" max="32" value="5"></label>
      </section>
      <section id="sticker-panel" class="tool-popover" aria-label="Галерея вклеек" hidden>
        <div id="sticker-picker" class="sticker-picker"></div>
        <p class="sticker-help">Выберите вклейку, затем нажмите на разворот.</p>
        <label class="sticker-upload">Добавить PNG, WebP или JPEG <input id="sticker-file" type="file" accept="image/png,image/webp,image/jpeg,.png,.webp,.jpg,.jpeg"></label>
        <p id="sticker-message" role="status"></p>
      </section>
      <section id="sticker-edit" class="tool-popover" aria-label="Выбранная вклейка" hidden>
        <label>Оформление <select id="sticker-finish">
          <option value="plain">Без оформления</option>
          <option value="photo">Фотокарточка</option>
          <option value="fold">Загнутый уголок</option>
          <option value="torn">Рваные края</option>
          <option value="tape">Бумажный скотч</option>
        </select></label>
        <label>Размер <input id="sticker-size" type="range" min="20" max="140" value="38"></label>
        <label>Поворот <input id="sticker-angle" type="range" min="-180" max="180" value="0"></label>
        <div class="sticker-edit-actions"><button id="remove-sticker">Удалить</button><button id="close-sticker-edit">Готово</button></div>
      </section>
    </div>
    <div id="workspace" class="workspace">
      <aside id="left-margin" class="margin left"><div class="draw-surface" aria-label="Холст левого поля"></div><div class="field-sticker-layer"></div><time id="sheet-date" class="sheet-date"></time><span class="folio" aria-hidden="true">01</span></aside>
      <article class="composition" aria-label="Текущая композиция">
        <div class="picture"><canvas id="reference" width="960" height="520" role="img"></canvas></div>
        <p id="reference-status" class="reference-status" hidden></p>
        <div id="desktop-palette"><div id="palette" class="palette" aria-label="Цвета референса" hidden></div></div>
        <div class="actions"><button id="next" class="primary">Следующее</button><button id="save">В архив</button><button id="back-to-archive" hidden>← Назад в архив</button></div>
      </article>
      <button class="drawer-tab" id="left-tab" type="button" aria-expanded="false" aria-controls="left-margin" aria-label="Левое поле" title="Потяните или нажмите"></button>
      <button class="drawer-tab" id="right-tab" type="button" aria-expanded="false" aria-controls="right-margin" aria-label="Правое поле" title="Потяните или нажмите"></button>
      <aside id="right-margin" class="margin right"><div class="draw-surface" aria-label="Холст правого поля"></div><div class="field-sticker-layer"></div><span class="folio" aria-hidden="true">02 <span class="sheet-mark">✧</span></span></aside>
      <canvas id="drawing" aria-label="Прозрачный слой наброска"></canvas>
      <div id="sticker-layer" class="sticker-layer"></div>
    </div>
    <p id="status" role="status"></p>
  </main>
  <dialog id="confirm-turn"><form method="dialog"><p>Перелистнуть страницу и стереть рисунок с полей?</p><div class="archive-actions"><button value="cancel" autofocus>Отмена</button><button value="turn">Перелистнуть</button></div></form></dialog>
  <dialog id="confirm-delete"><form method="dialog"><p>Удалить эту работу из архива?</p><div class="archive-actions"><button value="cancel" autofocus>Отмена</button><button value="delete">Удалить</button></div></form></dialog>
  <dialog id="archive"><div class="dialog-head"><h2>Архив находок</h2><button id="close-archive" aria-label="Закрыть архив">×</button></div><p id="archive-status" role="status"></p><div id="entries"></div></dialog>
</body>
</html>
